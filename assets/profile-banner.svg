<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="t d">
<title id="t">Jaison A — Business Analytics, Automation and Digital Builds</title><desc id="d">Layered futuristic 3D analytics interface with glass dashboards, glowing charts, data networks and a dark cyan violet color palette.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#0b1531"/><stop offset="1" stop-color="#190d36"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ffaff"/><stop offset=".5" stop-color="#23d6f5"/><stop offset="1" stop-color="#287bff"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0a7ff"/><stop offset="1" stop-color="#7847ff"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#93efff" stop-opacity=".22"/><stop offset="1" stop-color="#8b6aff" stop-opacity=".035"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#1479ff" stop-opacity=".32"/><stop offset="1" stop-color="#1479ff" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#89aaff" stroke-opacity=".12"/></pattern>
</defs>
<rect width="1500" height="520" rx="28" fill="url(#bg)"/><rect width="1500" height="520" rx="28" fill="url(#grid)"/>
<ellipse cx="1130" cy="265" rx="480" ry="340" fill="url(#halo)"/>
